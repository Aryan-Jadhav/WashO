{% extends "base.html" %}
{% block title %}Log in{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-7 col-lg-5">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
          <h2 class="mb-1">Welcome back</h2>
          <p class="text-muted mb-4">Log in with your mobile number.</p>
          <form method="post" novalidate>
            {% csrf_token %}
            {% include "partials/_form.html" %}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit" class="btn btn-primary w-100 py-2">Log in</button>
          </form>
          <p class="text-center small mt-4 mb-0">New to WashO? <a href="{% url 'accounts:register' %}">Create an account</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
