{% extends "base.html" %}
{% block title %}Sign up{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-9 col-lg-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
          <h2 class="mb-1">Create your account</h2>
          <p class="text-muted mb-4">Book pickups, track orders and download invoices.</p>
          <form method="post" novalidate>
            {% csrf_token %}
            {% include "partials/_form.html" %}
            <button type="submit" class="btn btn-primary w-100 py-2">Sign up</button>
          </form>
          <p class="text-center small mt-4 mb-0">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
