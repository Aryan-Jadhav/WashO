{% extends "base.html" %}
{% block title %}Edit profile{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 640px;">
  <a href="{% url 'accounts:account' %}" class="small"><i class="bi bi-arrow-left"></i> Back to my account</a>
  <div class="card border-0 shadow-sm mt-3">
    <div class="card-body p-4">
      <h3 class="mb-1">Edit profile</h3>
      <p class="text-muted small mb-4">Your mobile number ({{ user.phone }}) is your login ID and can't be changed here.</p>
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "partials/_form.html" %}
        <button type="submit" class="btn btn-primary">Save changes</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
